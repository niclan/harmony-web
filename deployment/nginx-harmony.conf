# Nginx configuration snippet for Harmony Hub Web Controller
# Place this file in /etc/nginx/conf.d/harmony.conf
# It will be automatically included by nginx
#
# Note: Update the port (5000) to match your PORT environment variable in systemd service

# Optional: Restrict access to local network only
# Uncomment and configure if you want to block external access
#
# If using ingress nginx, trust it to pass real client IP:
# set_real_ip_from 192.168.1.10;      # Replace with your ingress nginx IP
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

location /harmony {
    # Optional: IP-based access control (uncomment to enable)
    # Restricts access to local network clients only
    # allow 192.168.1.0/24;      # Your local network range
    # allow 10.0.0.0/8;          # Private network (if used)
    # allow 172.16.0.0/12;       # Private network (if used)
    # deny all;                   # Block everything else

    # Proxy to Flask application running on localhost
    # Port should match PORT environment variable in harmony-web.service (default: 5000)
    proxy_pass http://127.0.0.1:5000;

    # Preserve original request headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (if needed in future)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts for long-running requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Disable buffering for real-time responses
    proxy_buffering off;
}
