# Nginx configuration snippet for Harmony Hub Web Controller
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled/
# Or include it in your main nginx config with: include /path/to/nginx-harmony.conf;
#
# Note: Update the port (5000) to match your PORT environment variable in systemd service

location /harmony {
    # Proxy to Flask application running on localhost
    # Port should match PORT environment variable in harmony-web.service (default: 5000)
    proxy_pass http://127.0.0.1:5000;

    # Preserve original request headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (if needed in future)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts for long-running requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Disable buffering for real-time responses
    proxy_buffering off;
}
