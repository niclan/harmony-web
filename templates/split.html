<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony and Lyrion</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
               background: #000; color: #fff; font-family: system-ui, sans-serif; }
        details { flex-shrink: 0; }
        summary { padding: 5px 10px; font-size: 14px; cursor: pointer; }
        form { padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        input[type="url"] { flex: 1; min-width: 160px; padding: 8px; }
        button, a { padding: 8px; }
        a { color: #b4d7ff; }
        .views { flex: 1; min-height: 0; display: grid; grid-template-rows: 40fr 60fr; gap: 6px; }
        iframe { border: 0; background: white; width: 100%; height: 100%; min-height: 0; }
        .error { padding: 10px; background: #a21b28; }
    </style>
</head>
<body>
    <details{% if error %} open{% endif %}>
        <summary>Split settings</summary>
        <form action="{{ url_for('harmony.split_view') }}" method="get">
            <label for="lyrion-url">Lyrion URL</label>
            <input id="lyrion-url" name="lyrion_url" type="url" value="{{ lyrion_url }}" required>
            <button type="submit">Load</button>
            <label for="height">Harmony height</label>
            <input id="height" type="range" min="20" max="80" value="40" aria-label="Harmony height percent">
            {% if not error %}<a href="{{ lyrion_url }}" target="_blank" rel="noopener noreferrer">Open Lyrion</a>{% endif %}
        </form>
    </details>
    {% if error %}
    <div class="error" role="alert">{{ error }}</div>
    {% else %}
    <main class="views" id="views">
        <iframe title="Harmony controller" src="{{ url_for('harmony.index') }}" allow="autoplay"></iframe>
        <iframe title="Lyrion music player" src="{{ lyrion_url }}"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups" allow="autoplay"></iframe>
    </main>
    {% endif %}
    <script>
        document.getElementById('height').addEventListener('input', event => {
            const views = document.getElementById('views');
            const height = Number(event.target.value);
            if (views) views.style.gridTemplateRows = `${height}fr ${100 - height}fr`;
        });
    </script>
</body>
</html>
